name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node / Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync, validate and build plugin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-upstream-skills.mjs
          node scripts/sync-upstream-skills.mjs --check
          bun test
          bun run build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ skills/
          if ! git diff --staged --quiet; then
            git commit -m "chore(skills): sync upstream skills and rebuild"
            git push
          fi
